name: Scene Variant Sets
description: Discover, review, and manage related scene variants as explicit primary and child sets.
version: 0.5.22
interface: js
exec:
  - scene-metadata-variants.js
errLog: info

settings:
  dryRun:
    displayName: Dry run by default
    type: BOOLEAN
  createMissingTags:
    displayName: Create missing character/review/variant tags
    type: BOOLEAN
  createMissingGroups:
    displayName: Create missing artist Groups
    type: BOOLEAN
  createMissingStudios:
    displayName: Create missing franchise Studios
    type: BOOLEAN
  confidenceThreshold:
    displayName: Auto-apply confidence threshold
    type: NUMBER
  franchiseStudioField:
    displayName: Franchise field
    type: STRING
  variantHiddenTag:
    displayName: Variant hidden helper tag
    type: STRING
  allowOverwrite:
    displayName: Allow metadata overwrite
    type: BOOLEAN
  variantScanLimit:
    displayName: Variant maintenance scan limit
    type: NUMBER
  variantScanPageSize:
    displayName: Variant maintenance page size
    type: NUMBER
  needsReviewTag:
    displayName: Needs review helper tag
    type: STRING
  enableManualVariantNesting:
    displayName: Enable manual variant nesting UI
    type: BOOLEAN
  addHiddenTagWhenNested:
    displayName: Add hidden tag when nesting variant
    type: BOOLEAN
  removeHiddenTagWhenUnlinked:
    displayName: Remove hidden tag when unlinking variant
    type: BOOLEAN
  copyPrimaryStudioToVariantIfMissing:
    displayName: Copy primary studio to variant if missing
    type: BOOLEAN
  copyPrimaryGroupsToVariantIfMissing:
    displayName: Copy primary groups to variant if missing
    type: BOOLEAN
  copyPrimaryTagsToVariantIfMissing:
    displayName: Copy primary tags to variant if missing
    type: BOOLEAN
  allowVariantMetadataOverwrite:
    displayName: Allow metadata overwrite during nesting
    type: BOOLEAN
  variantDiscoveryDistance:
    displayName: Variant discovery pHash distance (lower is stricter)
    type: NUMBER
  variantDiscoveryDurationDiff:
    displayName: Variant discovery duration difference in seconds
    type: NUMBER
  variantDiscoveryLimit:
    displayName: Variant discovery scan limit
    type: NUMBER
  variantFilenameHeuristics:
    displayName: Bridge duplicate-supported scenes with filename evidence
    type: BOOLEAN
  variantMetadataHeuristics:
    displayName: Enable metadata variant heuristics
    type: BOOLEAN
  variantAutoSuggestThreshold:
    displayName: Variant auto-suggest threshold
    type: NUMBER
  variantReviewThreshold:
    displayName: Variant review threshold
    type: NUMBER

tasks:
  - name: "Variant Sets: Preview metadata backfill"
    description: Legacy helper for previewing scene Studio/Groups/Tags from the bundled mappings.
    defaultArgs:
      mode: bulk_auto_tag
      dryRun: true

  - name: "Variant Sets: Attach child scene"
    description: Attach an existing child scene to a primary scene using plugin-owned custom fields.
    defaultArgs:
      mode: link_variant
      dryRun: true

  - name: "Variant Sets: Detach child scene"
    description: Detach one child scene from its variant set.
    defaultArgs:
      mode: unlink_variant
      dryRun: true

  - name: "Variant Sets: Make child primary"
    description: Swap a child scene with the current primary while preserving every family member and position.
    defaultArgs:
      mode: promote_variant
      dryRun: true

  - name: "Variant Sets: Move child to another set"
    description: Move an existing child scene under a different primary scene.
    defaultArgs:
      mode: move_variant
      dryRun: true

  - name: "Variant Sets: Rename child label"
    description: Update the display label of a child scene.
    defaultArgs:
      mode: rename_variant
      dryRun: true

  - name: "Variant Sets: Reorder children"
    description: Update child order within a variant set.
    defaultArgs:
      mode: reorder_variants
      dryRun: true

  - name: "Variant Sets: Reconcile one set"
    description: Reconcile one primary scene and its children from plugin-owned custom fields.
    defaultArgs:
      mode: rebuild_variant_set
      dryRun: true

  - name: "Variant Sets: Discover Candidate Variants"
    description: Read-only discovery of likely scene families using Stash duplicate clusters and filename/metadata evidence.
    defaultArgs:
      mode: discover_variant_candidates
      dryRun: true

  - name: "Variant Sets: Process approved families"
    description: Preview or create reviewed variant sets. Live creation requires confirmed=true.
    defaultArgs:
      mode: apply_variant_batch
      dryRun: true

  - name: "Variant Sets: Validate relationship graph"
    description: Validate all plugin-owned variant relationships and optionally repair safe inconsistencies.
    defaultArgs:
      mode: validate_variant_graph
      dryRun: true
      fix: false

  - name: "Variant Sets: Remove plugin relationships"
    description: Remove plugin-owned variant custom fields from scenes without deleting scenes or files.
    defaultArgs:
      mode: rollback_variants
      dryRun: true

# The scene-create post hook is intentionally not registered. Running GraphQL-heavy
# embedded JavaScript from the create hook can stall Stash scan jobs while new
# scene records are still being inserted. Use the manual dry-run bulk task after
# scans/imports complete instead.

ui:
  javascript:
    - scene-metadata-variants.js
    - ui/scene-variants.js
  css:
    - ui/scene-variants.css
